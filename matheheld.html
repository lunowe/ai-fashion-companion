<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathe-Helden: Das kleine 1x1 & Mix</title>
    <style>
      /* --- Design & Farben --- */
      :root {
        --primary: #ff9f1c;
        --secondary: #2ec4b6;
        --accent: #e71d36;
        --bg: #cbf3f0;
        --dark: #011627;
        --white: #ffffff;
      }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
        background-color: var(--bg);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;
      }

      .container {
        background: var(--white);
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 500px;
        position: relative;
        border: 5px solid var(--secondary);
        transition: border-color 0.3s;
      }

      h1 {
        color: var(--dark);
        margin-bottom: 10px;
      }

      /* --- Score Board --- */
      .score-board {
        font-size: 1.2rem;
        color: var(--primary);
        font-weight: bold;
        margin-bottom: 20px;
        background: #fff3cd;
        padding: 10px 20px;
        border-radius: 15px;
        display: inline-block;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
      }

      /* --- Modus Auswahl Buttons --- */
      .mode-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .mode-btn {
        padding: 10px 15px;
        border: none;
        border-radius: 15px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: transform 0.2s;
        font-weight: bold;
        color: white;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        margin-bottom: 5px;
      }

      .mode-btn:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .mode-btn:hover {
        transform: scale(1.05) translateY(-2px);
      }
      .mode-btn.active {
        box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.3);
        transform: scale(0.95);
        opacity: 0.9;
      }

      /* Farben für die Modi */
      .btn-mul {
        background-color: #ff9f1c;
      } /* Orange */
      .btn-div {
        background-color: #2ec4b6;
      } /* Türkis */
      .btn-add {
        background-color: #e71d36;
      } /* Rot */
      .btn-sub {
        background-color: #3f88c5;
      } /* Blau */
      .btn-mix {
        background-color: #9b59b6;
      } /* Lila - Zufall */

      /* --- Aufgaben Bereich --- */
      .problem-box {
        font-size: 4rem;
        color: var(--dark);
        margin: 20px 0;
        font-weight: bold;
        letter-spacing: 2px;
        min-height: 80px; /* Verhindert Springen */
      }

      input[type="number"] {
        font-size: 2rem;
        padding: 10px;
        width: 120px;
        text-align: center;
        border: 3px solid #ccc;
        border-radius: 15px;
        outline: none;
        font-family: inherit;
        background: #f9f9f9;
      }

      input[type="number"]:focus {
        border-color: var(--secondary);
        background: #fff;
      }

      /* --- Action Button --- */
      .check-btn {
        display: block;
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        font-size: 1.5rem;
        background-color: var(--secondary);
        color: white;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        box-shadow: 0 6px 0 #1a9e92;
        transition: all 0.1s;
      }

      .check-btn:active {
        box-shadow: 0 2px 0 #1a9e92;
        transform: translateY(4px);
      }

      /* --- Feedback --- */
      .message {
        margin-top: 20px;
        font-size: 1.3rem;
        min-height: 30px;
        font-weight: bold;
      }
      .correct {
        color: #2ecc71;
      }
      .wrong {
        color: #e74c3c;
      }

      /* --- Konfetti Animation --- */
      .confetti {
        position: fixed;
        width: 12px;
        height: 12px;
        background-color: #f00;
        animation: fall linear forwards;
        top: -10px;
        z-index: 999;
        border-radius: 3px;
      }

      @keyframes fall {
        to {
          transform: translateY(105vh) rotate(720deg);
        }
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container" id="gameBox">
      <h1>🦁 Mathe-Helden 🚀</h1>

      <div class="score-board">Punkte: <span id="score">0</span> 🌟</div>

      <div class="mode-selector">
        <button class="mode-btn btn-mul active" onclick="setMode('mul')">
          Mal (×)
        </button>
        <button class="mode-btn btn-div" onclick="setMode('div')">
          Geteilt (:)
        </button>
        <button class="mode-btn btn-add" onclick="setMode('add')">
          Plus (+)
        </button>
        <button class="mode-btn btn-sub" onclick="setMode('sub')">
          Minus (-)
        </button>
        <button class="mode-btn btn-mix" onclick="setMode('mix')">
          Zufall (🎲)
        </button>
      </div>

      <div class="problem-box" id="problem">Loading...</div>

      <input type="number" id="answer" placeholder="?" autocomplete="off" />

      <button class="check-btn" onclick="checkAnswer()">Prüfen!</button>

      <div class="message" id="message"></div>
    </div>

    <script>
      // --- Spiel Variablen ---
      let currentMode = "mul"; // Aktuell ausgewählter Modus
      let currentOpType = "mul"; // Tatsächlicher Typ der aktuellen Aufgabe (für Mix wichtig)
      let currentResult = 0;
      let score = 0;

      const problemEl = document.getElementById("problem");
      const inputEl = document.getElementById("answer");
      const messageEl = document.getElementById("message");
      const scoreEl = document.getElementById("score");
      const gameBox = document.getElementById("gameBox");

      // --- Start ---
      generateProblem();

      inputEl.addEventListener("keypress", function (event) {
        if (event.key === "Enter") checkAnswer();
      });

      // --- Modus wechseln ---
      function setMode(mode) {
        currentMode = mode;

        // Buttons aktualisieren
        document
          .querySelectorAll(".mode-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.querySelector(`.btn-${mode}`).classList.add("active");

        // Rahmenfarbe anpassen für besseres Feedback
        updateBorderColor(mode);

        resetInput();
        generateProblem();
      }

      function updateBorderColor(mode) {
        const colors = {
          mul: "#FF9F1C",
          div: "#2EC4B6",
          add: "#E71D36",
          sub: "#3f88c5",
          mix: "#9b59b6",
        };
        gameBox.style.borderColor = colors[mode] || "#2EC4B6";
      }

      // --- Aufgabe generieren ---
      function generateProblem() {
        let num1, num2, symbol;

        // Entscheide, welcher Aufgabentyp generiert wird
        if (currentMode === "mix") {
          const modes = ["mul", "div", "add", "sub"];
          currentOpType = modes[Math.floor(Math.random() * modes.length)];
        } else {
          currentOpType = currentMode;
        }

        switch (currentOpType) {
          case "mul": // 1x1
            num1 = getRandomInt(2, 9);
            num2 = getRandomInt(2, 9);
            currentResult = num1 * num2;
            symbol = "·";
            break;

          case "div": // Geteilt ohne Rest
            let result = getRandomInt(2, 9);
            let factor = getRandomInt(2, 9);
            num1 = result * factor;
            num2 = factor;
            currentResult = result;
            symbol = ":";
            break;

          case "add": // Plus bis 100
            num1 = getRandomInt(2, 80);
            num2 = getRandomInt(2, 100 - num1);
            currentResult = num1 + num2;
            symbol = "+";
            break;

          case "sub": // Minus ohne negative
            num1 = getRandomInt(10, 100);
            num2 = getRandomInt(2, num1 - 2);
            currentResult = num1 - num2;
            symbol = "-";
            break;
        }

        problemEl.textContent = `${num1} ${symbol} ${num2} =`;
        inputEl.focus();
      }

      // --- Antwort prüfen ---
      function checkAnswer() {
        const userVal = parseInt(inputEl.value);

        if (isNaN(userVal)) {
          setMessage("Gib bitte eine Zahl ein!", "wrong");
          return;
        }

        if (userVal === currentResult) {
          score += 10;
          scoreEl.textContent = score;
          setMessage(getRandomPraise(), "correct");
          spawnConfetti();

          // Kurze Wartezeit vor nächster Aufgabe
          setTimeout(() => {
            resetInput();
            generateProblem();
          }, 1200);
        } else {
          setMessage("Fast! Probier's nochmal. 💪", "wrong");
          score = Math.max(0, score - 5);
          scoreEl.textContent = score;
          inputEl.value = "";
          inputEl.focus();
          shakeBox();
        }
      }

      // --- Hilfsfunktionen ---
      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function setMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = "message " + type;
      }

      function getRandomPraise() {
        const praises = [
          "Super! 🎉",
          "Richtig! ⭐",
          "Klasse! 🚀",
          "Genial! 🧠",
          "Weiter so! 🔥",
        ];
        return praises[Math.floor(Math.random() * praises.length)];
      }

      function resetInput() {
        inputEl.value = "";
        messageEl.textContent = "";
      }

      function shakeBox() {
        gameBox.style.animation = "shake 0.4s";
        setTimeout(() => (gameBox.style.animation = "none"), 400);
      }

      const styleSheet = document.createElement("style");
      styleSheet.innerText = `
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
    `;
      document.head.appendChild(styleSheet);

      function spawnConfetti() {
        for (let i = 0; i < 40; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti");
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.animationDuration = Math.random() * 1.5 + 1 + "s";
          confetti.style.backgroundColor = `hsl(${
            Math.random() * 360
          }, 100%, 50%)`;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 2500);
        }
      }
    </script>
  </body>
</html>
